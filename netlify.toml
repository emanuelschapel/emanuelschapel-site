# Netlify build + hosting config.
#
# Without this file Netlify has to guess the publish directory for a Vite app, and the
# site served a bare 404 on every path. Everything below is deliberate.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs a modern Node; matches the version the site is developed on.
  NODE_VERSION = "22"

# BrowserRouter does client-side routing. Without this rewrite a direct hit or refresh on
# /services, /about, etc. is a hard 404 from Netlify because no such file exists in dist/.
# Status 200 (not 301) keeps the URL in the address bar and lets the router take over.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-cache the hashed asset bundles; they change name on every build.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers. The CSP is an allowlist of exactly what the site uses; adding a new
# third-party embed (analytics, a chat widget, a different map) means adding its origin
# here first or it will be silently blocked. Test locally with `npx netlify serve`.
#
#   script-src   own bundle only. No inline scripts exist (Vite emits a module file); the
#                JSON-LD blocks are type=application/ld+json and are data, not scripts.
#   style-src    own CSS, Google Fonts CSS, and 'unsafe-inline' because React sets a few
#                style="" attributes (hero gradients). Attribute styles cannot run code.
#   img-src      own images, data: URIs, and Sanity's image CDN for obituary portraits.
#   connect-src  own origin (Netlify Forms POST) and the Sanity API/CDN for obituaries.
#   frame-src    the Google Maps embed on /contact.
#   frame-ancestors 'none' replaces X-Frame-Options: DENY (the modern equivalent).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://cdn.sanity.io; connect-src 'self' https://*.apicdn.sanity.io https://*.api.sanity.io; frame-src https://www.google.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
