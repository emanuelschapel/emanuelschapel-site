<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="t">
  <title id="t">A single lit candle</title>
  <defs>
    <!-- deep, warm ground so the flame reads as light -->
    <radialGradient id="ground" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#3a2a30"/>
      <stop offset="0.55" stop-color="#1f181b"/>
      <stop offset="1" stop-color="#141414"/>
    </radialGradient>
    <!-- outer halo: brand pink fading to nothing -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF96C5" stop-opacity="0.55"/>
      <stop offset="0.35" stop-color="#FF96C5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FF96C5" stop-opacity="0"/>
    </radialGradient>
    <!-- inner glow: warm gold -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFE6B0" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#F9C48A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F9C48A" stop-opacity="0"/>
    </radialGradient>
    <!-- flame -->
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6DC"/>
      <stop offset="0.45" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#FF7AB6"/>
    </linearGradient>
    <linearGradient id="flameCore" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE9A8" stop-opacity="0.6"/>
    </linearGradient>
    <!-- candle body: ivory with side shading -->
    <linearGradient id="wax" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#cfc3bb"/>
      <stop offset="0.35" stop-color="#FCFAF9"/>
      <stop offset="0.7" stop-color="#f0e7e1"/>
      <stop offset="1" stop-color="#b8aaa2"/>
    </linearGradient>
    <linearGradient id="waxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9F2"/>
      <stop offset="1" stop-color="#e9dfd8"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="softer" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#ground)"/>

  <!-- light on the surface the candle stands on -->
  <ellipse cx="400" cy="548" rx="230" ry="26" fill="#FF96C5" opacity="0.10" filter="url(#softer)"/>

  <!-- halo and glow around the flame -->
  <circle cx="400" cy="235" r="240" fill="url(#halo)"/>
  <circle cx="400" cy="235" r="120" fill="url(#glow)"/>

  <!-- candle -->
  <g>
    <!-- body -->
    <rect x="352" y="300" width="96" height="250" rx="6" fill="url(#wax)"/>
    <!-- top ellipse (the melted rim) -->
    <ellipse cx="400" cy="300" rx="48" ry="12" fill="url(#waxTop)"/>
    <!-- melted pool: darker inner ellipse -->
    <ellipse cx="400" cy="301" rx="34" ry="7" fill="#e6d9d2"/>
    <!-- a drip, for honesty -->
    <path d="M436 306 c4 10 6 22 4 34 c-1 6 -6 8 -8 2 c-2 -10 -1 -22 0 -34 z" fill="#f5ede8"/>
    <!-- base shadow -->
    <ellipse cx="400" cy="552" rx="52" ry="8" fill="#000" opacity="0.35" filter="url(#soft)"/>
  </g>

  <!-- wick -->
  <path d="M399 300 q3 -14 1 -30" stroke="#2a1f1c" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- flame: outer, then bright core -->
  <path d="M400 190 c22 26 30 46 24 66 c-4 14 -14 22 -24 22 c-10 0 -20 -8 -24 -22 c-6 -20 2 -40 24 -66 z"
        fill="url(#flame)" opacity="0.95"/>
  <path d="M400 222 c10 13 14 24 11 35 c-2 7 -7 11 -11 11 c-4 0 -9 -4 -11 -11 c-3 -11 1 -22 11 -35 z"
        fill="url(#flameCore)"/>
  <!-- flame bloom -->
  <ellipse cx="400" cy="245" rx="34" ry="46" fill="#FFE6B0" opacity="0.25" filter="url(#soft)"/>

  <!-- a quiet laurel pair, echoing the wreath on the reception wall -->
  <g fill="none" stroke="#FF96C5" stroke-opacity="0.28" stroke-width="2" stroke-linecap="round">
    <path d="M250 470 q-40 -60 -20 -130"/>
    <path d="M550 470 q40 -60 20 -130"/>
    <g stroke-width="1.6">
      <path d="M242 440 l-18 -6 M238 415 l-18 -8 M236 390 l-16 -10 M238 365 l-14 -12"/>
      <path d="M558 440 l18 -6 M562 415 l18 -8 M564 390 l16 -10 M562 365 l14 -12"/>
    </g>
  </g>
</svg>
